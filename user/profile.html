<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f6f7fb;
font-family:Segoe UI;
}

.page-title{
font-weight:600;
}

.card-box{
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 3px 15px rgba(0,0,0,0.05);
margin-bottom:30px;
}

.form-control,
.form-select{
height:48px;
border-radius:8px;
border:1px solid #e5e7eb;
}

textarea.form-control{
height:auto;
}

.form-label{
font-weight:500;
}

.btn-theme{
background:#2f6fdd;
color:white;
border:none;
padding:10px 22px;
border-radius:8px;
}

.btn-theme:hover{
background:#1d56b5;
}

#profilePhoto{
border:4px solid #f1f1f1;
}

.upload-box{
border:2px dashed #d9d9d9;
padding:30px;
border-radius:10px;
cursor:pointer;
}

.section-title{
font-weight:600;
margin-bottom:25px;
}

#map{
height:350px;
border-radius:10px;
margin-top:20px;
}

</style>
</head>


<body>

<div class="container mt-4">

<h2 class="page-title">My Profile</h2>
<p class="text-muted">Manage your personal information</p>


<!-- PROFILE SECTION -->

<div class="card-box">

<div class="row g-4">

<div class="col-md-3 text-center">

<img src="https://i.pravatar.cc/150" class="rounded-circle mb-3" width="120" id="profilePhoto">

<div class="upload-box mb-3">
<input type="file" id="photoInput" class="form-control">
</div>

<button class="btn btn-theme btn-sm">Change Photo</button>

</div>


<div class="col-md-9">

<div class="row g-4">

<div class="col-md-6">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" id="name">
</div>

<div class="col-md-6">
<label class="form-label">Job Title</label>
<input type="text" class="form-control" id="job">
</div>

<div class="col-md-6">
<label class="form-label">Phone</label>
<input type="text" class="form-control" id="phone">
</div>

<div class="col-md-6">
<label class="form-label">Email Address</label>
<input type="email" class="form-control" id="email">
</div>

<div class="col-md-6">
<label class="form-label">Website</label>
<input type="text" class="form-control" id="website">
</div>

<div class="col-md-6">
<label class="form-label">Current Salary</label>
<select class="form-select" id="salary">
<option>40-70K</option>
<option>70-100K</option>
<option>100-150K</option>
</select>
</div>

<div class="col-md-6">
<label class="form-label">Experience</label>
<select class="form-select" id="experience">
<option>Fresher</option>
<option>1-3 Years</option>
<option>3-5 Years</option>
<option>5-10 Years</option>
</select>
</div>

<div class="col-md-6">
<label class="form-label">Age</label>
<select class="form-select" id="age">
<option>18-22</option>
<option>23-27</option>
<option>28-35</option>
</select>
</div>

<div class="col-12">
<label class="form-label">Description</label>
<textarea class="form-control" rows="4" id="about"></textarea>
</div>

</div>

<div class="mt-4">
<button class="btn btn-theme" onclick="saveProfile()">Save</button>
</div>

</div>
</div>
</div>


<!-- SOCIAL NETWORK -->

<div class="card-box">

<h4 class="section-title">Social Network</h4>

<div class="row g-4">

<div class="col-md-6">
<label>Facebook</label>
<input type="text" class="form-control" id="facebook">
</div>

<div class="col-md-6">
<label>Twitter</label>
<input type="text" class="form-control" id="twitter">
</div>

<div class="col-md-6">
<label>LinkedIn</label>
<input type="text" class="form-control" id="linkedin">
</div>

<div class="col-md-6">
<label>Google Plus</label>
<input type="text" class="form-control" id="google">
</div>

</div>

<div class="mt-4">
<button class="btn btn-theme">Save</button>
</div>

</div>



<!-- CONTACT INFORMATION -->

<div class="card-box">

<h4 class="section-title">Contact Information</h4>

<div class="row g-4">

<div class="col-md-6">
<label>Country</label>
<select class="form-select">
<option>India</option>
<option>Australia</option>
<option>USA</option>
</select>
</div>

<div class="col-md-6">
<label>City</label>
<input type="text" class="form-control">
</div>

<div class="col-12">
<label>Complete Address</label>
<input type="text" class="form-control">
</div>

<div class="col-md-6">
<label>Latitude</label>
<input type="text" class="form-control">
</div>

<div class="col-md-6">
<label>Longitude</label>
<input type="text" class="form-control">
</div>

</div>

<div id="map"></div>

<div class="mt-4">
<button class="btn btn-theme">Save</button>
</div>

</div>


</div>

</body>
</html>
