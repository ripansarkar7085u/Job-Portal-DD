<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerHunt Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="user.css">
</head>
<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <a class="navbar-brand" href="#">
            <img src="/photos/job logo.png" alt="CareerHunt">
        </a>

        <div class="sidebar-menu">
            <a onclick="loadSection('dashboard.html', this)" class="active"><i class="bi bi-house"></i> Dashboard</a>
            <a onclick="loadSection('profile.html', this)"><i class="bi bi-person"></i> My Profile</a>
            <a onclick="loadSection('resume.html', this)"><i class="bi bi-file-earmark-text"></i> My Resume</a>
            <a onclick="loadSection('applied.html', this)"><i class="bi bi-briefcase"></i> Applied Jobs</a>
            <a onclick="loadSection('alerts.html', this)"><i class="bi bi-bell"></i> Job Alerts</a>
            <a onclick="loadSection('shortlisted.html', this)"><i class="bi bi-bookmark"></i> Shortlisted Jobs</a>
            <a onclick="loadSection('cv.html', this)"><i class="bi bi-file-earmark"></i> CV Manager</a>
            <a onclick="loadSection('messages.html', this)"><i class="bi bi-chat"></i> Messages</a>
            <a onclick="loadSection('password.html', this)"><i class="bi bi-lock"></i> Change Password</a>
            <a onclick="logout()"><i class="bi bi-arrow-repeat"></i> Logout</a>
            <a onclick="loadSection('delete.html', this)"><i class="bi bi-trash"></i> Delete Profile</a>
        </div>

    </div>

    <!-- CONTENT -->
    <div class="content" id="content">
        <!-- Section content will load here -->
    </div>

</div>

<script src="user.js"></script>
<script>
    // Load default section
    loadSection('dashboard.html', document.querySelector('.sidebar-menu a.active'));

    function logout() {
        alert("Logged out!");
    }
</script>
</body>
</html>
