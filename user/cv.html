<section class="cv-manager">
    <div class="container">
        <h2 class="section-title">CV Manager</h2>
        <p class="section-description text-muted">Manage your CV files here.</p>

        <table class="table align-middle">
            <thead>
                <tr>
                    <th>CV Name</th>
                    <th>Date Uploaded</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>

                <!-- CV 1 -->
                <tr>
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <div class="cv-logo bg-primary">
                                <i class="bi bi-file-earmark-text"></i>
                            </div>
                            <div>
                                <strong>John_Doe_CV.pdf</strong><br>
                                <small class="text-muted">Main CV</small>
                            </div>
                        </div>
                    </td>
                    <td>Jan 15, 2024</td>
                    <td><span class="badge bg-success">Active</span></td>
                    <td>
                        <button class="action-btn" title="View CV">
                            <i class="bi bi-eye"></i>
                        </button>
                        <button class="action-btn" title="Edit CV">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="action-btn" title="Download CV">
                            <i class="bi bi-download"></i>
                        </button>
                        <button class="action-btn" title="Delete CV">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>

            </tbody>
        </table>

        <!-- Upload New CV Button -->
        <div class="mt-3">
            <label class="btn btn-primary">
                <i class="bi bi-upload"></i> Upload New CV
                <input type="file" id="uploadCV" style="display:none;" accept=".pdf,.doc,.docx" />
            </label>
        </div>
    </div>
</section>

<script>
    const uploadInput = document.getElementById('uploadCV');

    uploadInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if(file){
            alert(`CV "${file.name}" selected for upload.`);

            // TODO: Add code here to send the file to your server
        }
    });
</script>
