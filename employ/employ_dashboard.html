<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Dashboard - CareerHunt</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="employ.css">
</head>

<body>

<div class="dashboard-wrapper">

<nav class="sidebar">

<div class="logo-section">
<img src="/photos/job logo.png" class="img-fluid" alt="CareerHunt">
</div>

<div class="sidebar-menu">
<a onclick="loadSection('pages/emp-dashboard.html', this)" class="active"><i class="bi bi-house"></i> Dashboard</a>

<main class="content-area">
